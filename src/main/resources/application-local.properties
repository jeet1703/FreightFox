# "local" profile: in-memory H2 instead of PostgreSQL, sample data instead of PhantomBuster.
# Run with: mvnw spring-boot:run "-Dspring-boot.run.profiles=local"
spring.datasource.url=jdbc:h2:mem:alumni;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
phantombuster.mock=true
