spring.application.name=alumni-search
server.port=${PORT:8080}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/alumni}
spring.datasource.username=${DB_USERNAME:alumni}
spring.datasource.password=${DB_PASSWORD:alumni}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- PhantomBuster ---
# mock=true returns sample profiles without calling PhantomBuster.
phantombuster.mock=${PHANTOMBUSTER_MOCK:false}
phantombuster.api-key=${PHANTOMBUSTER_API_KEY:}
# Id of a "LinkedIn Search Export" phantom in your workspace (the number in its URL).
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID:}
# Optional: LinkedIn li_at cookie. Leave blank to use the one saved in the phantom's setup.
phantombuster.session-cookie=${LINKEDIN_SESSION_COOKIE:}
phantombuster.max-profiles=25
phantombuster.poll-interval=5s
phantombuster.timeout=3m
